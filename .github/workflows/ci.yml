name: Desktop CI

on:
  pull_request:
  push:
    branches: [main, release, artcraft-release, artcraft-windows, artcraft-macos]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests and browser regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "true"
      NODE_OPTIONS: --max-old-space-size=6144
      PLAYWRIGHT_CHANNEL: chromium
      VITE_ENVIRONMENT_TYPE: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Unit tests
        run: npm run test:unit
      - name: Unix launcher regressions
        run: npm run test:launcher
      - name: Build desktop frontend
        run: npm run build:desktop
      - name: Install browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Development browser regressions
        run: npm run test:browser
      - name: Production browser regressions
        run: npm run test:browser:production
      - name: Upload built frontend
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artcraft-frontend
          path: frontend/apps/artcraft/dist/
          if-no-files-found: error
          retention-days: 14
      - name: Upload test reports and failure screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  native:
    name: Native checks and packages (${{ matrix.platform }})
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: windows-latest
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: macos-latest
            platform: macos-arm64
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15-intel
            platform: macos-x64
            target: x86_64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: "2"
      SQLX_OFFLINE: "true"
      # Match the Windows release's BoringSSL/static CRT configuration.
      RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C target-feature=+crt-static' || '' }}
      # Keep debug output and linker memory manageable on hosted runners.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - name: Download tested frontend
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: artcraft-frontend
          path: frontend/apps/artcraft/dist/
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          save-if: ${{ github.event_name == 'push' }}
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake pkg-config clang libclang-dev llvm perl nasm \
            libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libfuse2t64 patchelf zip \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav
          echo "LIBCLANG_PATH=$(llvm-config --libdir)" >> "$GITHUB_ENV"
      - name: Install Windows native dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco upgrade cmake --version=4.4.4 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          choco install strawberryperl pkgconfiglite llvm nasm --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Select the freshly installed CMake by absolute path, even when
          # cc-rs replaces PATH with the MSVC build environment.
          $cmakeCommand = Join-Path $env:ProgramFiles 'CMake\bin\cmake.exe'
          $capabilitiesJson = & $cmakeCommand -E capabilities
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $capabilities = $capabilitiesJson | ConvertFrom-Json
          if ('Visual Studio 18 2026' -notin $capabilities.generators.name) {
            throw "CMake $($capabilities.version.string) cannot build with Visual Studio 2026."
          }
          Write-Host "Using CMake $($capabilities.version.string) at $cmakeCommand"
          "CMAKE=$cmakeCommand" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          @(
            'C:\Program Files\CMake\bin'
            'C:\Program Files\NASM'
            'C:\Program Files\LLVM\bin'
            'C:\Strawberry\perl\bin'
            'C:\Strawberry\c\bin'
          ) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'LIBCLANG_PATH=C:\Program Files\LLVM\bin' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install macOS native dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake pkg-config llvm nasm
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - name: Check desktop and native commands
        run: cargo check --locked -p artcraft --lib
      - name: Test desktop identity and HTTP policy
        run: cargo test --locked -p artcraft_client_identity -p tauri-plugin-http --lib
      - name: Test local scene files
        run: cargo test --locked -p artcraft --lib core::commands::scene_files
      - name: Build release binaries and installers
        working-directory: crates/desktop/artcraft
        env:
          # Run AppImage packaging tools without needing a FUSE mount in CI.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: >-
          npx --yes @tauri-apps/cli@2.12.1 build --ci
          --config tauri.ci.conf.json
          --target ${{ matrix.target }}
          --bundles ${{ matrix.bundles }} -- --locked
      - name: Zip Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/ci -Force | Out-Null
          Compress-Archive -LiteralPath target/${{ matrix.target }}/release/artcraft.exe, LICENSE.md -DestinationPath dist/ci/ArtCraft-${{ matrix.platform }}.zip
      - name: Zip Linux executable
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/ci
          zip -j dist/ci/ArtCraft-${{ matrix.platform }}.zip target/${{ matrix.target }}/release/artcraft LICENSE.md
      - name: Zip macOS application
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/ci
          ditto -c -k --sequesterRsrc --keepParent target/${{ matrix.target }}/release/bundle/macos/ArtCraft.app dist/ci/ArtCraft-${{ matrix.platform }}.zip
          zip -j dist/ci/ArtCraft-${{ matrix.platform }}.zip LICENSE.md
      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artcraft-installers-${{ matrix.platform }}
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload zipped binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artcraft-binaries-${{ matrix.platform }}
          path: dist/ci/ArtCraft-${{ matrix.platform }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
